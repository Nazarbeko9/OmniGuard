name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Give Gradle Execution Permission
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          # -x lint buyrug'i kod ichidagi plugin xatolarini e'tiborsiz qoldirib, majburlab APK faylni chiqarib beradi!
          ./gradlew assembleDebug -x lint --continue